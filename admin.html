<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理后台 · Muse Invites</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    .admin-wrap { min-height: 100vh; padding: 60px 20px; position: relative; z-index: 1; }
    .admin-container { max-width: 720px; margin: 0 auto; }
    .admin-title { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px; }
    .admin-sub { color: var(--text-secondary); margin-bottom: 28px; font-size: 15px; }
    .admin-card {
      background: rgba(28, 28, 30, 0.6);
      backdrop-filter: blur(20px);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 24px;
      margin-bottom: 16px;
    }
    .admin-card h3 { font-size: 17px; font-weight: 600; margin-bottom: 16px; }
    .featured-input { display: flex; gap: 10px; margin-bottom: 16px; }
    .featured-input input {
      flex: 1;
      padding: 12px 16px;
      border: 0.5px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      background: rgba(0,0,0,0.3);
      color: var(--text);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 500;
    }
    .featured-input input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(10,132,255,0.2); }
    .featured-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .featured-chip {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 14px;
      background: rgba(10,132,255,0.15);
      color: var(--accent);
      border-radius: 100px;
      font-size: 14px; font-weight: 500; letter-spacing: 1px;
    }
    .featured-chip button {
      width: 18px; height: 18px; border-radius: 50%;
      background: rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: var(--accent);
    }
    .empty-hint { color: var(--text-tertiary); font-size: 14px; font-style: italic; }
    .code-table { width: 100%; border-collapse: collapse; }
    .code-table th, .code-table td {
      padding: 12px 8px; text-align: left;
      border-bottom: 0.5px solid var(--border);
      font-size: 14px;
    }
    .code-table th { color: var(--text-tertiary); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
    .code-table td.code-val { font-weight: 600; letter-spacing: 2px; }
    .btn-del {
      padding: 6px 12px; border-radius: 8px;
      background: rgba(255,69,58,0.15); color: var(--danger);
      font-size: 13px; border: 0.5px solid rgba(255,69,58,0.3);
    }
    .btn-del:hover { background: rgba(255,69,58,0.25); }
    .btn-sm { padding: 8px 14px; font-size: 13px; }
    .login-box { max-width: 360px; margin: 100px auto; text-align: center; }
    .login-box input {
      width: 100%; padding: 14px 16px;
      border: 0.5px solid var(--border);
      border-radius: 12px;
      font-size: 16px;
      background: rgba(0,0,0,0.3);
      color: var(--text);
      margin-bottom: 14px;
    }
    .login-box input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(10,132,255,0.2); }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-size: 14px; margin-bottom: 20px; }
    .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 8px; }
    .stat-box { padding: 18px; background: rgba(0,0,0,0.3); border-radius: 14px; text-align: center; border: 0.5px solid var(--border); }
    .stat-box .num { font-size: 26px; font-weight: 700; }
    .stat-box .lbl { font-size: 12px; color: var(--text-tertiary); margin-top: 4px; }
    .row-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="bg-glow" aria-hidden="true">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
  </div>

  <div id="loginView" class="admin-wrap">
    <div class="login-box">
      <div style="font-size:40px;margin-bottom:16px;">🔒</div>
      <h1 class="admin-title" style="font-size:24px;">管理后台</h1>
      <p class="admin-sub">请输入管理密码</p>
      <form id="loginForm">
        <input type="password" id="loginPwd" placeholder="管理密码" autocomplete="off" required />
        <button type="submit" class="btn btn-primary btn-block">进入后台</button>
      </form>
      <p style="margin-top:20px;font-size:12px;color:var(--text-tertiary);">密码以 SHA-256 哈希存储于前端，修改请编辑 admin.js</p>
    </div>
  </div>

  <div id="adminView" class="admin-wrap" style="display:none;">
    <div class="admin-container">
      <a href="/" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        返回首页
      </a>
      <h1 class="admin-title">Muse Invites · 管理后台</h1>
      <p class="admin-sub">管理邀请码池与重点推荐</p>

      <div class="admin-card">
        <h3>数据概览</h3>
        <div class="stat-row">
          <div class="stat-box"><div class="num" id="statTotal">0</div><div class="lbl">总码数</div></div>
          <div class="stat-box"><div class="num" id="statFeatured">0</div><div class="lbl">推荐码</div></div>
          <div class="stat-box"><div class="num" id="statWorks">0</div><div class="lbl">有效反馈</div></div>
        </div>
      </div>

      <div class="admin-card">
        <h3>★ 重点推荐邀请码</h3>
        <p style="color:var(--text-secondary);font-size:14px;margin-bottom:16px;">推荐码会优先展示、优先被抽取，并带「★ 推荐」标识。</p>
        <div class="featured-input">
          <input type="text" id="featuredInput" placeholder="输入邀请码，例如 K4M2QP" maxlength="12" />
          <button id="addFeaturedBtn" class="btn btn-primary">添加</button>
        </div>
        <div class="featured-list" id="featuredList">
          <span class="empty-hint">暂无推荐码</span>
        </div>
      </div>

      <div class="admin-card">
        <h3>码池管理</h3>
        <div class="row-actions">
          <button id="resetBtn" class="btn btn-secondary btn-sm">重置为初始数据</button>
          <button id="clearBtn" class="btn btn-sm" style="color:var(--danger);">清空所有码</button>
          <button id="logoutBtn" class="btn btn-ghost btn-sm" style="margin-left:auto;">退出登录</button>
        </div>
        <div style="overflow-x:auto;">
          <table class="code-table">
            <thead>
              <tr>
                <th>邀请码</th>
                <th>有效</th>
                <th>失效</th>
                <th>抽取</th>
                <th>分享时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="codeTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/admin.js"></script>
</body>
</html>
